<section class="section lumieres-section fade-appear" id="lumieres">
  <div class="lumieres-title">
    <div>LUMIÈRE DUPLEX</div>
    <div>RESIDENCES</div>
  </div>

  <div class="carousel" data-carousel aria-label="Newest Photos">
    <button class="carousel-button prev" data-carousel-button="prev" aria-label="Previous slide">&#8656;</button>
    <button class="carousel-button next" data-carousel-button="next" aria-label="Next slide">&#8658;</button>
    <ul data-slides>
      <li class="slide" data-active>
        <img src="Lumieres1.jpeg" alt="Bed near large window">
      </li>
      <li class="slide">
        <img src="Lumieres2.jpeg" alt="Room with black chairs and table">
      </li>
      <li class="slide">
        <img src="Lumieres3.jpeg" alt="Living room with blue sofa">
      </li>
    </ul>
  </div>
</section>

<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }

.lumieres-section {
  background: #000;
  color: #fff;
  overflow: hidden;
  position: relative;
}
.lumieres-title {
  position: absolute;
  top: 8vh;
  left: 50%;
  text-align: center;
  z-index: 10;
  opacity: 0;
  transform: translateX(-50%) translateY(30px);
  transition: all 1s ease;
}
.lumieres-section.visible .lumieres-title {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.lumieres-title div {
  font-family: "Playfair Display", serif;
  font-weight: 300;
  font-size: clamp(2.5rem, 6vw, 8rem);
  line-height: 0.9;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}

.carousel {
  width: 100vw;
  height: 100vh;
  position: relative;
}
.carousel ul {
  margin: 0;
  padding: 0;
  list-style: none;
}
.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: 200ms opacity ease-in-out;
  transition-delay: 200ms;
}
.slide > img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.slide[data-active] {
  opacity: 1;
  z-index: 1;
  transition-delay: 0ms;
}

.carousel-button {
  position: absolute;
  z-index: 2;
  border: none;
  font-size: 4rem;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255, 255, 255, .5);
  cursor: pointer;
  border-radius: .25rem;
  padding: 0 .5rem;
  background-color: rgba(0, 0, 0, .1);
}
.carousel-button:hover,
.carousel-button:focus {
  color: white;
  background-color: rgba(0, 0, 0, .2);
}
.carousel-button:focus { outline: 1px solid white; }
.carousel-button.prev { left: 1rem; }
.carousel-button.next { right: 1rem; }
</style>

<script>
// Carousel
document.querySelectorAll("[data-carousel-button]").forEach(button => {
  button.addEventListener("click", () => {
    const offset = button.dataset.carouselButton === "next" ? 1 : -1;
    const slides = button.closest("[data-carousel]").querySelector("[data-slides]");
    const activeSlide = slides.querySelector("[data-active]");
    let newIndex = [...slides.children].indexOf(activeSlide) + offset;
    if (newIndex < 0) newIndex = slides.children.length - 1;
    if (newIndex >= slides.children.length) newIndex = 0;
    slides.children[newIndex].dataset.active = true;
    delete activeSlide.dataset.active;
  });
});

// Fade the title in when the section scrolls into view
const section = document.getElementById("lumieres");
new IntersectionObserver((entries, obs) => {
  if (entries[0].isIntersecting) {
    section.classList.add("visible");
    obs.disconnect();
  }
}, { threshold: 0.3 }).observe(section);
</script>
